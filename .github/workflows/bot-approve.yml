name: bot-approve
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Submit APPROVE as github-actions bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || 1 }}
        run: |
          set -x
          gh api -i "repos/${{ github.repository }}/pulls/${PR}/reviews" \
            -f event=APPROVE -f body='approval from github-actions bot' \
            | tee /tmp/review.raw
          echo '----- body -----'
          # print just the json body (last json object-ish): status line
          head -n 1 /tmp/review.raw || true
