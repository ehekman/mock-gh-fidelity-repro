name: bot-push-approve
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  push-then-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push a commit as the bot, then APPROVE, then PATCH title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "bot-push $(date -u +%s)" > BOTPUSH.md
          git add BOTPUSH.md
          git commit -m 'bot push to become last pusher'
          git push origin HEAD:feat
          echo '===== APPROVE ====='
          gh api -i "repos/${{ github.repository }}/pulls/1/reviews" \
            -f event=APPROVE -f body='bot approve after bot push' || true
          echo '===== PATCH title ====='
          gh api -i "repos/${{ github.repository }}/pulls/1" \
            -X PATCH -f title='title set by github-actions bot' || true
          echo '===== PATCH close ====='
          # do not close; only try base? skip close to keep the PR for the next experiment
          gh api -i "repos/${{ github.repository }}/pulls/1" \
            -X PATCH -f body='body set by github-actions bot' || true
