name: bot-push-approve
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  push-then-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push a commit as the bot, then APPROVE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f="BOTPUSH-$(date -u +%s).md"
          echo "bot-push" > "$f"
          git add "$f"
          git commit -m "bot push $f"
          git push origin HEAD:feat
          echo '===== APPROVE after own push (last-push flag ON) ====='
          gh api -i "repos/${{ github.repository }}/pulls/1/reviews" \
            -f event=APPROVE -f body='bot approve after bot push with last-push flag' || true
